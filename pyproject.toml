[project]
name = "discord_bot"
version = "0.12.0"
description = "Discord bot for Jim's Garage"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "colorlog>=6.10.1",
    "discord>=2.3.2",
    "dotenv>=0.9.9",
    "fastapi>=0.139.0",
    "feedparser>=6.0.12",
    "pyyaml>=6.0.3",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "invoke>=3.0.3",
    "pre-commit>=4.6.0",
    "pyrefly>=1.1.1",
    "ruff>=0.15.20",
    "shellcheck-py>=0.11.0.1",
    "yamllint>=1.38.0",
]
test = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "pytest-mock>=3.15.1",
]

[tool.bandit]
exclude_dirs = [
    ".venv",
    "tests",
]
skips = [
    "B104",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search-path = ["stubs"]

[tool.pytest]
addopts = [
    "--color=yes",
    "--cov=lib",
    "--cov=main",
    "--cov-branch",
    "--cov-fail-under=100",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--verbose",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env = [
    "PYTEST_THEME=emacs",
    "PYTEST_THEME_MODE=dark",
]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # Starlette 1.x nudges its TestClient toward httpx2, but FastAPI still pins
    # httpx<1.0 for TestClient — drop this once FastAPI adopts httpx2.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # discord.py/pytest-asyncio internals call the deprecated
    # asyncio.iscoroutinefunction (removed in 3.14) — upstream, not ours.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
markers = [
    "no_mock_config: exclude the mock_config fixture",
]
#
#[tool.pytest_env]
#PYTEST_THEME = "emacs"
#PYTEST_THEME_MODE = "dark"

[tool.ruff]
indent-width = 4
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ASYNC240",
    "COM812",
    "D",
    "FBT001",
    "FBT002",
    "FIX002",
    "TD003",
    "TRY301",
]
# ASYNC240 - suggests trio/anyio Path; we run on asyncio and only touch the
#            filesystem synchronously during one-time startup (cog loading)
# COM812 - ruff recommends disabling it for compatibilitiy (and will warn you about it every time)
# D - docustring checking
# FBT001, FBT002 - ruff doesn't like boolean positional arguments
# FIX002 - ruff doesn't like TO-DO's
# TD003 - ruff wants issue links for TO-DO's
# TRY301 - No raise inside try

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"lib/config.py" = [
    "ANN401",   # Allow dynamically typed expressions
    "ERA001"    # False positive commented out code
]
"tests/*.py" = [
    "PLR0913",  # Arg count in function def
    "PLR2004",  # Magic values
    "PLW0108",  # Explicit lambda in mock side_effect (readable test idiom)
    "S101",     # Use of `assert`
    "SLF001"    # Accessing private member
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.uv]
default-groups = ["dev", "test"]
