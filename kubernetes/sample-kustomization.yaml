---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Pull base manifest from GitHub via raw URL
  # GitHub kustomization.yaml has empty resources to avoid duplication
  - https://raw.githubusercontent.com/cyberops7/discord_bot/main/kubernetes/discordbot.yaml
  # PreSync hook to verify the image exists before deployment
  - presync-image-check.yaml

# Extract image tag from deployment and inject into PreSync hook
replacements:
  - source:
      kind: Deployment
      name: bot
      fieldPath: spec.template.spec.containers.0.image
    targets:
      - select:
          kind: Job
          name: check-image-exists
        fieldPaths:
          - spec.template.spec.containers.0.env.0.value

patches:
  - target:
      group: onepassword.com
      version: v1
      kind: OnePasswordItem
      name: bot-secrets
    patch: |-
     - op: replace
       path: /spec/itemPath
       value: <<< YOUR_VAULT_PATH_HERE >>>
